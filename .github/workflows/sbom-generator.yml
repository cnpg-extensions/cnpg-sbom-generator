name: Build and publish SBOM generator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a checked test image to GHCR (publish_latest takes precedence)"
        required: false
        default: false
        type: boolean
      publish_latest:
        description: "Force a checked release to latest (main only), including runtime maintenance"
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # renovate: datasource=docker depName=anchore/grype
  GRYPE_IMAGE: anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887
  # renovate: datasource=docker depName=anchore/grant
  GRANT_IMAGE: anchore/grant:v0.7.1@sha256:9ccd7c26dc48ce87cd9350e29fa8da5eaaedfabb3bc2e56f6b1ce3e9e7adc4b6

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-26.04
    env:
      SBOM_SMOKE_PLATFORM: linux/amd64
    permissions:
      contents: read
    concurrency:
      group: sbom-generator-check-${{ github.ref }}
      cancel-in-progress: true
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Build multiplatform generator
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "SBOM_GENERATOR_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag localhost:5000/cnpg-sbom-generator:check --push .

      - name: Run tests in generator image
        run: |
          docker run --rm --platform "$SBOM_SMOKE_PLATFORM" --entrypoint python3 \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            localhost:5000/cnpg-sbom-generator:check \
            -m unittest discover -s tests -p 'test_*.py'

      - name: Check BuildKit integration and license report
        run: bash tests/integration/buildkit-smoke.sh localhost:5000/cnpg-sbom-generator:check "$RUNNER_TEMP/sbom-check"

      - name: Save check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-generator-check-amd64
          path: ${{ runner.temp }}/sbom-check
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: check
    # Every push to main publishes after checks pass, including documentation changes.
    if: ${{ vars.SBOM_PUBLISH_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.publish || (inputs.publish_latest && github.ref == 'refs/heads/main')))) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: sbom-generator-publish
      cancel-in-progress: false
    services:
      registry:
        # renovate: datasource=docker depName=registry
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select publication destination
        id: destination
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest && github.ref == 'refs/heads/main' }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cnpg-sbom-generator" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push || "$PUBLISH_LATEST" == true ]]; then alias="latest"; else alias="test"; fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Publish or reuse commit image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: |
          python3 release.py build \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release"

      - name: Check published digest with BuildKit
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: |
          digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
          bash tests/integration/buildkit-smoke.sh "$IMAGE@$digest" "$RUNNER_TEMP/sbom-release/smoke"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checked generator image
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
        run: cosign sign --yes "$IMAGE@$(cat "$RUNNER_TEMP/sbom-release/digest")"

      - name: Promote checked digest
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
        run: |
          python3 release.py promote \
            --image "$IMAGE" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/sbom-release" --alias "$ALIAS"

      - name: Summarize publication
        if: always()
        env:
          IMAGE: ${{ steps.destination.outputs.image }}
          ALIAS: ${{ steps.destination.outputs.alias }}
        run: |
          {
            echo '## SBOM generator publication'
            echo "Source: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo 'Smoke-test architecture: linux/amd64; published platforms: linux/amd64 and linux/arm64.'
            if [[ -f "$RUNNER_TEMP/sbom-release/digest" ]]; then
              digest=$(cat "$RUNNER_TEMP/sbom-release/digest")
              echo "Commit artifact: \`$IMAGE:sha-$GITHUB_SHA@$digest\`"
              if [[ -f "$RUNNER_TEMP/sbom-release/promotion.json" ]] && jq -e '.promoted' "$RUNNER_TEMP/sbom-release/promotion.json" > /dev/null; then
                echo "Promoted reference: \`$IMAGE:$ALIAS@$digest\`"
              else
                echo "Alias $ALIAS was not promoted by this run. Check the job logs before using this artifact."
              fi
            fi
            echo "[Logs and evidence](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-generator-publication
          path: ${{ runner.temp }}/sbom-release
          if-no-files-found: ignore
